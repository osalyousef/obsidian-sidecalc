<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calculator preview</title>
<script>window.MathJax = { chtml: { fontURL: 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/output/chtml/fonts/woff-v2' }, startup: { typeset: false } };</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
<link rel="stylesheet" href="../styles.css">
<style>
	/* Approximations of Obsidian's default theme variables. */
	.theme-dark {
		--background-primary: #1e1e1e; --background-primary-alt: #242424;
		--background-secondary: #262626; --background-secondary-alt: #303030;
		--background-modifier-border: #363636; --background-modifier-hover: rgba(255,255,255,.075);
		--interactive-normal: #363636; --interactive-hover: #3f3f3f;
		--interactive-accent: hsl(258, 88%, 66%); --text-accent: hsl(258, 88%, 76%);
		--text-normal: #dadada; --text-muted: #b3b3b3; --text-faint: #666; --text-on-accent: #fff;
		--text-error: #fb464c; --color-orange: #e9973f; --color-red: #fb464c; --color-green: #44cf6e;
		--shadow-s: 0 1px 4px rgba(0,0,0,.4);
		color-scheme: dark;
	}
	.theme-light {
		--background-primary: #fff; --background-primary-alt: #fafafa;
		--background-secondary: #f6f6f6; --background-secondary-alt: #fff;
		--background-modifier-border: #e0e0e0; --background-modifier-hover: rgba(0,0,0,.067);
		--interactive-normal: #fff; --interactive-hover: #f0f0f0;
		--interactive-accent: hsl(258, 88%, 66%); --text-accent: hsl(258, 70%, 55%);
		--text-normal: #222; --text-muted: #5c5c5c; --text-faint: #ababab; --text-on-accent: #fff;
		--text-error: #e93147; --color-orange: #ec7500; --color-red: #e93147; --color-green: #08b94e;
		--shadow-s: 0 1px 4px rgba(0,0,0,.12);
		color-scheme: light;
	}
	:root {
		--font-interface: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
		--font-monospace: ui-monospace, Menlo, monospace;
		--radius-s: 4px; --radius-m: 8px; --size-4-2: 8px;
	}
	body { margin: 0; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;
		background: #0d0d0d; font-family: var(--font-interface); }
	button { font-family: var(--font-interface); border: 0; border-radius: var(--radius-s); cursor: pointer;
		background-color: var(--interactive-normal); color: var(--text-normal);
		box-shadow: 0 1px 1px rgba(0,0,0,.1); font-size: 13px; padding: 4px 12px; height: 30px; }
	.theme-light button { box-shadow: 0 0 0 1px #e0e0e0, 0 1px 2px rgba(0,0,0,.05); }
	figure { margin: 0; }
	figcaption { color: #888; font: 12px var(--font-monospace); margin-bottom: 6px; }
	[data-frame] { background: var(--background-secondary); color: var(--text-normal); overflow: hidden;
		border: 1px solid #333; resize: both; font-size: 14px; }
	[data-frame] > .workspace-leaf-content { height: 100%; display: flex; flex-direction: column; }
	[data-frame] .view-content { flex: 1; min-height: 0; background: var(--background-secondary); }
	.preview-notice { position: fixed; top: 12px; right: 12px; background: #333; color: #eee; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
	<figure><figcaption>sidebar 300×720 · dark</figcaption><div data-frame class="theme-dark" style="width:300px;height:720px"></div></figure>
	<figure><figcaption>short sidebar 260×540</figcaption><div data-frame class="theme-dark" style="width:260px;height:540px"></div></figure>
	<figure><figcaption>floating 340×640 · light</figcaption><div data-frame class="theme-light" style="width:340px;height:640px"></div></figure>
	<script type="module" src="dist/preview.js"></script>
</body>
</html>
